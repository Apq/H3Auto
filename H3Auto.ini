[General]
DisableOnStart=0      ; 战斗开始时是否禁用自动化：0=不禁用（默认启用），1=禁用
; Language=界面文案语言（lang\<语言>.ini，缺省 zh-CN；缺文件回落内置默认）
Language=zh-CN

[Hotkeys]
; 战斗中人工接管热键（只影响本场执行权，不改 5 套方案/游标）
; ToggleManual 支持 F1-F12、单个字母，或直接写虚拟键码（如 122、0x7B）
; OneShotManual 只允许单个字母，禁止 F1-F12、数字、Ctrl、Alt、Tab、Shift
ToggleManual=F9       ; 切换本场「自动 / 全手动」
OneShotManual=J       ; 锁定接管当前或下一支部队；该部队完成一次人工行动后恢复自动
OpenSettings=P        ; 打开/关闭设置面板（战场右键“自动战斗”按钮亦可）

[Logging]
; DisableLog=1 完全关闭日志；MinLevel=最小记录级别（trace/debug/info/warn/error）
DisableLog=0
MinLevel=info