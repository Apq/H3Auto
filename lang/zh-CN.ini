[tips] # 状态栏悬停提示
color_wrap = {金}%s
titlebar = 热键：%s 启停打铁 · %s 单次接管 · %s 打开设置 · 右键“自动战斗”按钮也可打开
btn_battle_dd = 本场存档：列出这场战斗每次点√确定的方案快照（最多30条）；点开选一条载入草稿，点√确定才生效；首次打开面板时最新一条已自动载入
btn_profile = 方案 1-5：各编号独立草稿；切换编号各自保留，确定按当前编号生效
summon_enable = 启用自动召唤：与保活同一条施法通道，保活优先。每次行动（还有施法次数时）先按各部队卡片的方式判保活；无人可救且已勾选时，再看兵力是否不足（队数/血量阈值）而召唤元素补位。默认关闭=只保活、不召唤
stop_mana = 敌方魔力停止：默认勾选；敌方英雄（有魔法书）魔力 ≤ 右侧阈值时切回手动，与停止回合数任一满足即停
stop_mana_th = 敌方魔力阈值：默认 6，范围 0..32767；随方案存档，配合左侧勾选生效
stop_row = 停止：敌方预计剩余回合 ≤ 此值时切回手动；0=关闭，最大 999
status_th = 补状态阈值：所有已配置的状态魔法都保持；任意法术在任意己方部队（减速为敌方全体覆盖）上剩余回合 ≤ 此值就补施它，多个到期补剩余最少的。默认 1，范围 1..9；随方案存档
btn_ok = 勾号：草稿生效并关闭面板，同时自动存一条本场存档（内容没变则不重复存）；有效期同一场战斗（含取消重打）
btn_cancel = 取消：丢弃全部修改并关闭面板
action_opt0 = 行动·手动：轮到本部队时交给玩家操作
action_opt1 = 行动·防御：自动防御
action_opt3 = 行动·循环移动：按槽位顺序走向战场格，走完从头再来
action_opt4 = 行动·循环近战：按「站立格→攻击格」成对循环攻击
action_opt5 = 行动·远程攻击：自动远程攻击，目标按目标选择排序
action_opt6 = 行动·急救治疗：自动治疗己方伤员，目标按目标选择排序
action_opt7 = 行动·散开：尽量与己方所有其它部队保持至少 2 格；做不到时降为 1 格，再做不到原地防御（召唤物行动专用）
action_opt8 = 行动·随机移动：随机挑一格移动，无路可走时可勾选降级为防御（召唤物行动专用）
selector_opt0 = 目标选择·随机：候选中随机挑一个
selector_opt1 = 目标选择·远程飞兵高速优先：先打远程和飞行，再按速度；同类同速优先打血量更高的那队
selector_opt2 = 目标选择·数量最多：优先数量最多的部队
selector_opt3 = 目标选择·失血比例：优先失血比例最高的（急救用）
selector_opt4 = 目标选择·失血数值：优先失血数值最大的（急救用）
cell_fallback = 允许降级为防御：目标不可达或动作失败时自动防御，否则交回玩家
cell_drop = 选择一项；点外部或再点一次收起
tab_army = 部队页：每支部队的行动、循环施法/移动/近战与保活方式
tab_summon = 召唤页：勾「启用自动召唤」后，保活无人可救且按「和/或」组合的队数/血量条件满足时召唤元素补位；召唤物共用行动
summon_spell_opt0 = 法术·自动：已学的四系召唤里选单次召唤总量最大的元素；首次成功施放后本场锁定该元素
summon_spell_opt1 = 法术·气元素：固定召唤气元素；未学该法术则不施放
summon_spell_opt2 = 法术·水元素：固定召唤水元素；未学该法术则不施放
summon_spell_opt3 = 法术·火元素：固定召唤火元素；未学该法术则不施放
summon_spell_opt4 = 法术·土元素：固定召唤土元素；未学该法术则不施放
summon_count = 队数阈值：存活的本体部队加存活的召唤物（不含战争机器、克隆）小于此值即满足队数条件；默认 2，范围 2..21
summon_hp = 血量阈值：己方各队剩余血量加总（存活数×单兵满血−顶层已损，含召唤物、不含战争机器）≤ 此值即满足血量条件；默认 750
summon_cond = 条件组合：队数与血量两条件怎么搭配——和=两个都满足才召唤（默认）；或=任一满足即召唤
summon_action = 召唤物行动：手动/防御/散开/随机移动，全部召唤物共用一个设置；默认防御
summon_fallback = 允许降级为防御：随机移动找不到可走格时改为防御；仅行动=随机移动时显示并生效
tab_profile = 方案页：方案级设置——自动停止回合数与敌方魔力停止
protect_opt_none = 保活·不保活：该队不参与保活
protect_opt_count = 保活·剩余数量≤：剩余数量不超过「剩≤」才救
protect_opt_loss = 保活·损失量>恢复量：损失超过一次恢复量才救
cell_protect_count = 保活数量阈值：该队剩余数量 ≤ 此值才保活。默认 2，范围 0..2147483647；0 表示只救已全灭的部队。保活方式需为「剩余数量≤」
cell_spell = 行动前循环快捷施法：本部队行动前按槽位顺序投快捷施法键（1-9,0）；英雄每回合只施一次，已施法则跳过；右键槽位删除
cell_move = 循环移动：按槽位顺序走向战场格，走完一轮从头再来；右键槽位删除
cell_melee = 循环近战：每槽一对「站立格→攻击格」，按序循环执行；右键槽位删除

