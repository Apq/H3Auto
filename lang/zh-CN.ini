# 打铁助手中文文案（UTF-8）。修改后重启游戏生效；删掉本文件则用内置默认。
# 富文本颜色标记：{金}{绿}{红}{白}{灰}{黄}{蓝}{青}{高亮}{普通} 或 {#RRGGBB} {0xRRGGBB} {rgb(r,g,b)}
# 仅状态栏文案（status_*/pack_*）支持颜色标记；%s/%d 为运行时填充，请保留。
# 注意：值中 ASCII 分号 ; 之后的内容会被当注释忽略（行首 # 或 ; 为整行注释）。

[panel] # 设置面板
title = 打铁设置
load = 读档
save = 存档
protect_label = 保活策略:
protect_opt0 = 无
protect_opt1 = 按数量
protect_opt2 = 回合内首动
protect_opt3 = 损失量大于恢复量
stop_label = 停止:
profile_btn_fmt = 方案 %d
status_save_ok = {绿}存档成功
status_save_fail = {红}存档失败
status_load_ok = {绿}读档成功
status_load_fail = {红}读档失败

[help] # 帮助模态
title = 使用说明
line_open = 打开设置：右键“自动战斗”按钮，或按 %s 键
line1 = 方案 1-5：独立草稿与存档文件，读档/存档针对选中编号
line2 = 施法/近战/移动：点 ＋ 后按提示设置
line3 = 停止：敌方预计剩余回合内全灭时交回
line4 = 读档/存档：仅更新界面显示，点勾号才生效
line5 = 删除：槽位上右键
line_hotkey = 热键：%s 启停打铁 · %s 单次接管 · %s 打开设置
line6 = 设置有效期：同一场战斗，包括取消重打
close = 关闭
log_level_label = 日志级别:
log_level_opt0 = 全部
log_level_opt1 = 调试
log_level_opt2 = 信息
log_level_opt3 = 警告
log_level_opt4 = 错误
pack_btn = 打包日志
pack_title = 日志已打包
pack_ok = 日志已打包成 .7z 并复制为文件，直接到 QQ 聊天框粘贴发送即可。|QQ群：1042362808 / 740338251，或加 QQ：712999712 私发。|（QQ号已同时写在压缩包内的 00_说明.txt 里，解压即可复制）
pack_note = 请把同目录的日志文件发送到：|QQ群：1042362808 / 740338251|或加 QQ：712999712 私发|
pack_fail = {红}打包日志失败：%s
pack_no_logs = 没有找到日志文件
pack_clipboard_fail = zip 已生成但复制路径失败（剪贴板被占用），请手动复制
log_level_set = {绿}日志级别已设为 %s（已写入配置）

[tips] # 状态栏悬停提示
color_wrap = {金}%s
titlebar = 热键：%s 启停打铁 · %s 单次接管 · %s 打开设置 · 右键“自动战斗”按钮也可打开
btn_load = 读档：从选中编号的存档槽读入草稿（四轮部队关联）；仅更新界面，点勾号才生效
btn_save = 存档：把草稿写入选中编号的存档槽（其他槽不变）；不改变已生效方案
btn_profile = 方案 1-5：各编号独立草稿与存档文件；切换编号各自保留，读档/存档针对选中编号
protect_opt0 = 保活策略·无：不施保活，勾选的部队也不救
protect_opt1 = 保活策略·按数量：某队剩余数量不超过该队阈值才施救；阈值在每张部队卡片的「剩≤」框里逐队设置，默认 2，填 0 相当于只救已全灭的部队
protect_opt2 = 保活策略·回合内首动：队列里有损失的部队，英雄本回合第一次行动就救
protect_opt3 = 保活策略·损失量大于恢复量：已损血量超过一次能恢复的量才救
stop_row = 停止：敌方预计剩余回合 ≤ 此值时切回手动；0=关闭，最大 999
btn_ok = 勾号：草稿生效并关闭面板（不写盘）；有效期同一场战斗（含取消重打）
btn_cancel = 取消：丢弃全部修改并关闭面板
action_opt0 = 行动·手动：轮到本部队时交给玩家操作
action_opt1 = 行动·防御：自动防御
action_opt3 = 行动·循环移动：按槽位顺序走向战场格，走完从头再来
action_opt4 = 行动·循环近战：按「站立格→攻击格」成对循环攻击
action_opt5 = 行动·远程攻击：自动远程攻击，目标按目标选择排序
action_opt6 = 行动·急救治疗：自动治疗己方伤员，目标按目标选择排序
selector_opt0 = 目标选择·随机：候选中随机挑一个
selector_opt1 = 目标选择·远程飞兵高速优先：先打远程和飞行，再按速度；同类同速优先打血量更高的那队
selector_opt2 = 目标选择·数量最多：优先数量最多的部队
selector_opt3 = 目标选择·失血比例：优先失血比例最高的（急救用）
selector_opt4 = 目标选择·失血数值：优先失血数值最大的（急救用）
cell_fallback = 允许降级为防御：目标不可达或动作失败时自动防御，否则交回玩家
cell_protect = 加入保活队列：勾选后参与方案级保活策略的复活判定
cell_drop = 选择一项；点外部或再点一次收起
cell_protect_count = 部队保活数量阈值：该队剩余数量 ≤ 此值才进入保活候选。默认 2，范围 0..2147483647；0 表示只救已全灭的部队。仅在保活策略为「按数量」时显示并生效
cell_spell = 行动前循环快捷施法：本部队行动前按槽位顺序投快捷施法键（1-9,0）；英雄每回合只施一次，已施法则跳过；右键槽位删除
cell_move = 循环移动：按槽位顺序走向战场格，走完一轮从头再来；右键槽位删除
cell_melee = 循环近战：每槽一对「站立格→攻击格」，按序循环执行；右键槽位删除

[cell] # 格子控件
allow_fallback = 允许降级为防御
pre_cast_label = 行动前循环快捷施法:
protect_join = 加入保活队列
protect_count_lbl = 剩≤
target_melee_pair = 循环站立位+攻击位
target_wounded = 己方伤员
target_none = 无目标
spell_modal_title = 设置快捷施法键
spell_modal_slot = 正在设置循环施法第 %d 槽
spell_modal_hint1 = 请直接按数字键 1-9 或 0（支持小键盘）
spell_modal_hint2 = 输入后自动保存；按 ESC 或点击取消放弃。
spell_modal_cancel = 取消

[hud] # 战场角标
prefix = 打铁助手: %s
mode_auto = 自动
mode_manual = 全手动
mode_oneshot = 单次接管
mode_wait = 单次待命

[actions] # 行动下拉标签（键=AutoActionKind 枚举序号；2=等待为占位）
0 = 手动
1 = 防御
2 = 等待
3 = 循环移动
4 = 循环近战
5 = 远程攻击
6 = 急救治疗

[selectors] # 目标选择器标签（键=AutoTargetSelector 枚举序号）
0 = 随机
1 = 远程飞兵高速优先
2 = 数量最多
3 = 失血比例
4 = 失血数值
